<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KANT OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">

  <!-- Device frame -->
  <div class="device" id="device">

    <!-- Status bar -->
    <div class="statusbar">
      <span class="statusbar__clock" id="statusClock">00:00</span>
      <div class="statusbar__icons">
        <span class="pill pill--link" id="linkPill">
          <i class="dot dot--off" id="linkDot"></i><span id="linkLabel">연결 대기</span>
        </span>
        <svg class="icon" viewBox="0 0 20 14" fill="none"><path d="M1 5c5-4.5 13-4.5 18 0M4 8c3.5-3 8.5-3 12 0M7.3 11c1.8-1.5 3.6-1.5 5.4 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <svg class="icon" viewBox="0 0 24 14" fill="none"><rect x="1" y="2" width="19" height="10" rx="2.2" stroke="currentColor" stroke-width="1.3"/><rect x="22" y="5" width="1.6" height="4" rx="0.8" fill="currentColor"/><rect x="2.6" y="3.6" width="14" height="6.8" rx="1" fill="currentColor" id="batteryFill"/></svg>
      </div>
    </div>

    <!-- LOCK SCREEN -->
    <section class="screen screen--lock" id="lockScreen">
      <div class="lock__top">
        <div class="lock__time" id="lockTime">00:00</div>
        <div class="lock__date" id="lockDate">-</div>
      </div>
      <div class="lock__widget">
        <div class="lock__widget-title">KANT PAIRING</div>
        <div class="lock__widget-row"><span>DEVICE</span><b id="lockDevice">kant-phone-01</b></div>
        <div class="lock__widget-row"><span>HOST</span><b id="lockHost">raspberrypi.local</b></div>
        <div class="lock__widget-row"><span>PORT</span><b id="lockPort">8420</b></div>
      </div>
      <button class="lock__hint" id="unlockBtn">
        <span>위로 밀어 잠금 해제</span>
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </section>

    <!-- HOME SCREEN -->
    <section class="screen screen--home" id="homeScreen" hidden>
      <div class="home__clock">
        <div class="home__time" id="homeTime">00:00</div>
        <div class="home__date" id="homeDate">-</div>
      </div>

      <div class="pairing-card" id="pairingCard">
        <div class="pairing-card__head">
          <span class="pairing-card__eyebrow">RASPBERRY PI LINK</span>
          <i class="dot dot--off" id="cardDot"></i>
        </div>
        <div class="pairing-card__addr">
          <span id="cardHost">raspberrypi.local</span><span class="pairing-card__colon">:</span><span id="cardPort">8420</span>
        </div>
        <div class="pairing-card__meta">
          <span id="cardStatus">SSH 대기 · Docker 미확인</span>
          <span id="cardUptime">uptime —</span>
        </div>
      </div>

      <div class="app-grid" id="appGrid"></div>

      <div class="dock" id="dock"></div>

      <div class="home-indicator" id="homeIndicator"></div>
    </section>

    <!-- APP SCREEN (generic full-screen app host) -->
    <section class="screen screen--app" id="appScreen" hidden>
      <div class="app__header">
        <button class="app__back" id="appBack">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="appTitle">앱</span>
        </button>
      </div>
      <div class="app__body" id="appBody"></div>
    </section>

  </div>

  <p class="stage__caption">KANT Mobile OS Environment — Volla Plinius inspired shell, tuned for Raspberry Pi</p>
</div>

<script src="app.js"></script>
</body>
</html>
